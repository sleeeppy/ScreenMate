# 설치 파일 만들기 (Windows NSIS, macOS 유니버설 DMG).
# 직접 실행(Actions → release → Run workflow)하거나 v로 시작하는 태그를 올리면 돈다.
# 태그를 올리면 결과물을 GitHub Release에 붙인다. 앱은 이 릴리스를 보고 그 자리에서 업데이트한다.
# 파일 이름은 버전 없이 고정해서 README의 releases/latest/download/... 링크가 늘 최신 파일을 가리키게 한다.
# 모델은 설치 파일에 들어 있지 않다.
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # 모델(models/)은 설치 파일에 넣지 않으므로 LFS 파일은 받지 않는다
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npx tauri build --bundles nsis

      # 앱의 업데이트는 이름에 setup이 든 .exe를 고른다
      - name: Rename installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $exe.FullName out/ScreenMate-windows-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenMate-windows
          path: out/ScreenMate-windows-setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 애플 실리콘과 인텔 맥 둘 다 돌도록 유니버설로 만든다
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Tauri는 CI(CI=true)에서 DMG를 꾸미는 Finder AppleScript를 건너뛴다(--skip-jenkins).
      # 그러면 배경 그림·아이콘 위치 없이 큰 빈 창으로 열린다. 이 변수로 CI에서도 꾸미게 한다.
      - run: npx tauri build --target universal-apple-darwin --bundles dmg
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"

      - name: Rename disk image
        run: |
          mkdir -p out
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg out/ScreenMate-macos-universal.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenMate-macos
          path: out/ScreenMate-macos-universal.dmg
          if-no-files-found: error

  # v 태그일 때만. 앱의 업데이트는 이 릴리스의 파일과 SHA-256(GitHub가 붙이는 digest)을 본다.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ScreenMate-*
          path: bundle
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: bundle/*
          generate_release_notes: true
          body: |
            ## 내려받기

            - **macOS** (애플 실리콘·인텔): [ScreenMate-macos-universal.dmg](https://github.com/sleeeppy/screenmate/releases/download/${{ github.ref_name }}/ScreenMate-macos-universal.dmg)
            - **Windows** 10·11: [ScreenMate-windows-setup.exe](https://github.com/sleeeppy/screenmate/releases/download/${{ github.ref_name }}/ScreenMate-windows-setup.exe)

            설치 파일에는 모델이 들어 있지 않아요. 앱을 켜면 나오는 안내를 따라 가지고 있는 MMD 모델(.pmx·.pmd) 폴더를 가져오세요.
            서명하지 않은 앱이라 처음 열 때 경고가 뜰 수 있어요. 여는 방법은 [README의 설치](https://github.com/sleeeppy/screenmate#install)를 보세요.
