# Windows 설치 파일(NSIS .exe) 만들기.
# Windows PC에 Rust·VS Build Tools를 깔지 않고 설치 파일을 받기 위해 GitHub에서 빌드한다.
# 직접 실행(Actions → windows-installer → Run workflow)하거나 v로 시작하는 태그를 올리면 돈다.
# 결과는 실행 화면 아래 Artifacts의 "ScreenMate-windows"에서 받는다. 모델은 들어 있지 않다.
name: windows-installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # 모델(models/)은 설치 파일에 넣지 않으므로 LFS 파일은 받지 않는다
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenMate-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
